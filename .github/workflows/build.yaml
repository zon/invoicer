name: Build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zon/invoicer

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: Lint the chart
        run: helm lint deploy/chart
      - name: Build the image
        run: |
          podman build \
            --file deploy/container/Containerfile \
            --label "org.opencontainers.image.version=$(sh scripts/version.sh)" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "$IMAGE:ci" .
      - name: Install Trivy
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz" \
            | sudo tar --extract --gzip --file - --directory /usr/local/bin trivy
      - name: Save the image
        run: podman save --output /tmp/invoicer-image.tar "$IMAGE:ci"
      - name: Scan the image
        run: trivy image --input /tmp/invoicer-image.tar --severity HIGH,CRITICAL --exit-code 1
      - name: Log in to the container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          podman tag "$IMAGE:ci" "$IMAGE:sha-${GITHUB_SHA:0:7}"
          podman push "$IMAGE:sha-${GITHUB_SHA:0:7}"
      - name: Log in to the chart registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish the chart
        if: github.event_name == 'push'
        run: sh scripts/publish-chart.sh deploy/chart oci://ghcr.io/zon/charts
