name: Build Container

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: build-container
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/zon/invoicer

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      built: ${{ steps.check.outputs.built }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read the app version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Log in to the container registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Check the image
        id: check
        run: |
          if skopeo inspect "docker://$IMAGE:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [check]
    if: needs.check.outputs.built == 'false'
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: Build the image
        run: |
          podman build \
            --file deploy/container/Containerfile \
            --build-arg "VERSION=$APP_VERSION" \
            --label "org.opencontainers.image.version=$APP_VERSION" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "$IMAGE:ci" .
      - name: Install Trivy
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz" \
            | sudo tar --extract --gzip --file - --directory /usr/local/bin trivy
      - name: Save the image
        run: podman save --output /tmp/invoicer-image.tar "$IMAGE:ci"
      - name: Scan the image
        run: trivy image --input /tmp/invoicer-image.tar --severity HIGH,CRITICAL --exit-code 1
      - name: Log in to the container registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish the image
        run: |
          sh scripts/publish-image.sh \
            "$IMAGE" \
            "$APP_VERSION" \
            "$GITHUB_SHA" \
            "$IMAGE:ci"
      - name: Tag the release
        run: |
          tag="v$APP_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag is already on the remote"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
