{{define "index.html"}}<!doctype html>
<html lang="en">
{{template "head" .}}
<body>
  {{template "header" .}}
  <section class="invoice-list" aria-label="Invoices">
    <table>
      <thead>
        <tr>
          <th>Customer</th>
          <th>Month</th>
          <th>Year</th>
          <th>Project</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody>
        {{range .Invoices}}
        <tr>
          <td><a href="{{.Path}}">{{.Customer}}</a></td>
          <td>{{.Month}}</td>
          <td>{{.Year}}</td>
          <td>{{.Project}}</td>
          <td>{{.Total}}</td>
        </tr>
        {{else}}
        <tr>
          <td colspan="5">No invoices.</td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </section>
</body>
</html>{{end}}
