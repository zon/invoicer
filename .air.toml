#:schema https://json.schemastore.org/any.json

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/invoicer"
  bin = "./tmp/main"
  entrypoint = ["./tmp/main", "web"]
  include_ext = ["go", "html", "css"]
  exclude_dir = [".git", "bin", "docs", "invoices", "specs", "tmp", "testdata", "vendor"]
  exclude_regex = ["_test.go"]
  delay = 500
  kill_delay = "1s"
  send_interrupt = true
  stop_on_error = true
  log = "build-errors.log"

[log]
  time = true

[misc]
  clean_on_exit = true
