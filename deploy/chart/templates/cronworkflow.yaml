{{- if .Values.schedule.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: {{ include "invoicer.fullname" . }}
  namespace: invoicer
  labels:
    {{- include "invoicer.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule.cron | quote }}
  timezone: UTC
  concurrencyPolicy: Forbid
  workflowSpec:
    entrypoint: generate
    templates:
      - name: generate
        volumes:
          - name: config
            configMap:
              name: {{ include "invoicer.fullname" . }}-config
              defaultMode: 0444
          - name: data
            persistentVolumeClaim:
              claimName: {{ include "invoicer.dataClaimName" . }}
        container:
          image: {{ include "invoicer.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - generate
          volumeMounts:
            - name: config
              mountPath: /home/invoicer/.invoicer/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: data
              mountPath: /data
{{- end }}
