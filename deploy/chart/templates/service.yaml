apiVersion: v1
kind: Service
metadata:
  name: {{ include "invoicer.fullname" . }}
  labels:
    {{- include "invoicer.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "invoicer.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8080
