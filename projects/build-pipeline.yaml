- "`invoicer --version` prints the app version and exits successfully without running the generate, web, or set commands."
- "A binary built with no version stamp still reports a version, and `invoicer --version` succeeds."
- "`just build` stamps the version from git: a tagged commit reports the tag without its leading `v`, an untagged commit reports a version naming the commit after the last tag, and uncommitted changes mark the version dirty."
- "A container image build accepts the app version and stamps it into the binary, so `invoicer --version` inside the image reports it. A build without a version argument still produces a working image."
- "`.github/workflows` holds a workflow that runs on pull requests, pushes to `main`, and tags matching `v*`. A pull request run publishes nothing."
- "The workflow runs `go test ./...` and stops before publishing when a test fails."
- "The workflow builds the image with Podman from `deploy/container/Containerfile`, scans it with a pinned Trivy version, and stops before pushing when the scan finds a HIGH or CRITICAL vulnerability. The scan and the push use the same local image."
- "A pull request run builds the image and lints the chart at `deploy/chart`, and publishes neither."
- "A push to `main` publishes the image to `ghcr.io/zon/invoicer` tagged `sha-<short commit>`, using only the workflow `GITHUB_TOKEN` with package write permission. No build publishes a `latest` tag."
- "A published image carries OCI labels for version, revision, source, and creation time."
- "The workflow packages the chart at the `version` in `Chart.yaml` and pushes the package to `oci://ghcr.io/zon/charts` as `invoicer`. When that version is already published with identical content the push is skipped; when the content differs the build fails."
- "A tag build fails when the chart `appVersion` differs from the app version."
- "A tag build publishes the app version tag alongside the `sha-<short commit>` tag, both at the same digest. When the commit image is already published, the version tag is added to it; when it is not, one image supplies both tags."
- "A tag build fails when the app version tag is already published at a different digest."
- "`specs/architecture.yaml` records the CI workflow as the component that builds, scans, and publishes the image and chart."
- "A `v0.1.0` tag build from the release commit publishes image tag `0.1.0` and chart version `0.1.0`, and the binary inside the image reports `0.1.0`."
