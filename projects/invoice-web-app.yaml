- The store keeps one invoice per year and month. Saving an invoice for an existing month replaces the stored invoice, including when the customer or project differs, and keeps its identifier.
- Opening a database that holds more than one invoice for a year and month keeps the most recently created invoice and removes the others, so every database holds one invoice per month.
- The store lists every stored invoice newest first by year and month with its weekly line items, and returns the invoice for a given year and month, reporting when that month has none.
- The web app serves the invoice list at `/` with customer, month, year, project, and total for every stored invoice, newest first. Each entry links to the invoice detail.
- Selecting an invoice shows its detail on the same page as the list, with the list visible and the selected invoice in a panel beside it.
- A direct request to `/2027/oct` returns the complete page with that invoice selected. An unknown year or month, or a month with no invoice, returns 404.
- 'With htmx, selecting an invoice swaps only the detail panel and updates the browser address. A request with `HX-Request: true` returns one HTML element, and a missing invoice returns a not found fragment with status 404.'
- The web app escapes stored values so invoice fields never render as raw HTML.
- '`invoicer web` starts the server with `--address` defaulting to `:8080` and the database path from `--database`, then config, then the default.'
- The web server serves pages, fragments, the stylesheet, and htmx from the binary, needs no support files beside it, and shuts down gracefully on an interrupt.
- '`invoicer web` reports an error and exits non-zero when the database cannot open or the listen address is unavailable.'
- '`specs/architecture.yaml` records the CLI, config, invoice, store, and web components, and the README documents `invoicer web` and its flags.'
