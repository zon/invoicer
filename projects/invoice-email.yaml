- "Every stored invoice records the customer's contact email and an email send time. Opening an existing database migrates it in place without changing stored invoices, which start with no contact email and no send time. Saving an invoice stores its contact email and keeps any existing send time, and the store records a send time for a month. Loading an invoice returns both values."

- "`invoicer generate` accepts `--customer-email` and prefers it over the `customerEmail` config value. The config accepts `customerEmail` and a `resend` block with `apiKeyFile` and `from`. `invoicer set config --customer-email` writes the contact email and leaves any `resend` block alone. With any `resend` setting, generate exits with a clear error before it saves when `customerEmail`, `baseUrl`, `resend.apiKeyFile`, or `resend.from` is missing. With no `resend` settings, generate saves the invoice and sends nothing."

- "Add an `internal/email` component, recorded in `specs/architecture.yaml`, that renders the invoice message. The subject is `Invoice for <Month> <Year>`. The body is plain text and names the uppercase invoice identifier, month, year, vendor, the total in dollars with two decimals, and a link to the invoice detail. The link is `baseUrl` with no trailing slash plus the detail path. The message has one recipient, the invoice's contact email, the sender `resend.from`, and no attachments."

- "The email component sends through the Resend REST API over HTTPS with the official Resend Go SDK. It reads the API key from `resend.apiKeyFile`, gives up after a timeout, sends with the idempotency key `invoice/<identifier>` using the stored identifier, and returns the Resend email identifier when Resend accepts the message. Tests use a local HTTP stub and never contact Resend."

- "Generate saves the invoice, prints its identifier, and sends the email when the stored invoice has no send time, whether it created or edited the invoice. After a successful send it records the send time and prints the recipient and the Resend email identifier. A second run after a successful send sends nothing and keeps the send time, and generate sends nothing for a paid invoice."

- "A failed send reports an error and exits non-zero while the invoice stays stored with no send time, so a later generate sends it. A failure to record the send time after Resend accepts the message reports an error and leaves the invoice without a send time. A timeout, a rejected message, and a missing or unreadable API key file all count as failed sends."

- "`deploy/chart/values.yaml` holds `config.customerEmail` and a `resend` block with `from`, `secretName`, and `apiKeyKey`. When `resend.from` is set, the rendered config file holds `customerEmail` and a `resend` block naming `apiKeyFile: /run/secrets/resend-api-key` and that sender. When `resend.from` is empty, the rendered config holds no `resend` block."

- "When `resend.from` is set, the CronWorkflow pod mounts the existing Secret named by `resend.secretName` at `/run/secrets/resend-api-key` using the key `resend.apiKeyKey`, which defaults to `api-key`. The web Deployment mounts no Resend secret. The chart tests cover the rendered email config, the schedule secret mount, the web pod's lack of that mount, and the default key."

- "The README documents `--customer-email`, the `customerEmail` and `resend` config values, send-once and failure behavior, and the chart's `resend` values and required Secret."

- "Apply a semver patch bump to the app version, updating `VERSION` and the chart `version` and `appVersion` per the release design."
