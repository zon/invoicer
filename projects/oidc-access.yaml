- Add an access component that owns provider discovery, sign-in, the callback, and session cookies, expose it to the web app through one interface for the current user, and record the component in `specs/architecture.yaml`.
- The web app reads `baseUrl` and the `oidc` settings from the config file, applies the defaults for `adminGroup`, `customerGroup`, and `groupsClaim`, and `invoicer web` exits with a clear error when a required setting is missing or invalid.
- The `invoicer web` command reads the provider's discovery document from `oidc.issuer` at startup and exits with a clear error when the issuer is unreachable or the document lacks the authorization, token, or JWKS endpoints.
- The `GET /login` route redirects to the provider's authorization endpoint with the client ID, callback address, scopes `openid`, `email`, `profile`, and `groups`, state, nonce, and a PKCE challenge, and keeps state, nonce, and the PKCE verifier in a short-lived signed cookie.
- The `GET /callback` route checks the state, exchanges the code, validates the ID token's issuer, audience, expiry, and nonce, and starts a 12 hour session for a user in the admin or customer group, redirecting to the page the user first asked for or `/`.
- A sign-in fails with 401 and a complete HTML page linking to try again, and sets no session, when the state does not match, the ID token is invalid, the email is missing or unverified, or the user is in neither group.
- A request without a session goes to `/login` and returns to the requested page after sign-in, while `/style.css` loads without a session.
- The session cookie holds the email, role, and expiry, is encrypted and signed with the key from `oidc.cookieKeyFile`, is HttpOnly, Secure, and SameSite=Lax, and a missing, expired, or invalid cookie counts as no session.
- The `GET /logout` route clears the session and sends the user to `/login`. Every page shows the signed-in email and a sign-out link.
- Admin users and customer users both see every invoice in the list and detail, and an unknown invoice still returns 404.
- Automated tests cover a successful sign-in, a rejected user, an expired session, and sign-out against a local provider stub, without contacting a real provider.
- The README documents the required access settings, the sign-in flow, and that the web app needs a configured provider.
