- "`deploy/chart/values.yaml` holds `schedule.enabled: true` and `schedule.cron: \"0 9 1 * *\"`."
- "With `schedule.enabled` true, the chart renders one Argo `CronWorkflow` in the `invoicer` namespace, scheduled by `schedule.cron` in UTC."
- "The CronWorkflow runs one pod from the chart image with the `generate` argument and allows at most one workflow to run at a time."
- "The CronWorkflow pod mounts the rendered config file read-only at `/home/invoicer/.invoicer/config.yaml` and the data claim at `/data`."
- "The CronWorkflow pod attaches every `image.pullSecrets` entry and uses the web pod's security context and `resources`."
- "The CronWorkflow pod uses pod affinity to run on the node that holds the web pod."
- "The CronWorkflow retries a failed pod twice, removes a successful run after one day, and keeps a failed run."
- "With `schedule.enabled` false, the chart renders no CronWorkflow."
- "The chart tests cover the schedule defaults, the cron override, the disabled schedule, and the scheduled pod's command, mounts, pull secrets, security context, resources, retry policy, cleanup policy, and affinity."
- "`specs/architecture.yaml` describes the chart as deploying the web app and the monthly schedule."
- "Apply a patch bump to the chart `version`, keeping `appVersion` equal to `VERSION`."
